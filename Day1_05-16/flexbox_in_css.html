<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box In CSS</title>
    <style>
        .box{
            width: 100px;
            height: 100px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px;
        }
        .flexbox{
            display: flex;
            flex-direction: column-reverse;
            flex-wrap: nowrap;
            justify-content: space-around;
            align-items: center;
            padding: 10px;
            margin: 10px;
        }
        .flexitem1{
            background-color: #ff9999;
            flex-grow: 2;
        }
        .flexitem2{
            background-color: #99ff99;
            flex-shrink: 0.8;
        }
        .flexitem3{
            background-color: #9999ff;
            align-self: flex-start;
        }
        .flexitem4{
            background-color: #ffff99;
            align-self: flex-end;
        }
        .flexitem5{
            background-color: #ff99ff;
        }
    </style>
</head>
<body>
    <div class="flexbox">
    <div class="flexitem1 box">Item 1</div>
    <div class="flexitem2 box">Item 2</div>
    <div class="flexitem3 box">Item 3</div>
    <div class="flexitem4 box">Item 4</div>
    <div class="flexitem5 box">Item 5</div>
</div>

</body>
</html>
