    <script>
        console.log("JS Object is a collecion of Key-value pair");
        const user = {
            name : "Kamal",

            }
        }
        console.log(user);
        console.log(user.name);
        console.log(user["name"]);

        // object are mutuable and cannot be reassigned 
        user.city = "MNR";
        user.name  = "Aagyat"
        console.log(user);
        
        delete user.city;
        console.log(user);
        

// user.Tmp-city = "DHN" // not allowed

        user["Tmp-city"]= "DHN";

console.log(user.address.city);
